<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="sedoc - Smart Document Solutions. Convert, compress, merge, and split PDF, Word, Excel, and Visio files securely.">
    <meta name="robots" content="index, follow">
    
    <title>sedoc - Smart Document Solutions</title>
    
    <!-- Premium Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4598765809021376" crossorigin="anonymous"></script>

    <style>
        /* Locked sedoc Theme Variables */
        :root {
            --text-dark: #040633;
            --text-gray: #4b5563;
            --brand-gradient: linear-gradient(135deg, #f09709, #fe0097, #a302ff, #0000ff);
            --card-bg: rgba(255, 255, 255, 0.8);
            --border: rgba(4, 6, 51, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column; 
        }

        /* The Locked Background Orb */
        .gradient-orb {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            height: 600px;
            background: var(--brand-gradient);
            filter: blur(150px);
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }

        /* Minimal Header */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        /* Logo Set to Left Corner */
        .logo-link { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
        }
        
        .logo-link img { 
            height: 40px; 
            width: auto; 
            display: block;
        }

        /* Main Content */
        main {
            max-width: 1000px; 
            margin: 0 auto;
            padding: 40px 5%; 
            flex-grow: 1; 
            width: 100%;
        }

        .hero-text { text-align: center; margin-bottom: 40px; } 
        .hero-text h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.04em; margin-bottom: 10px; }
        .hero-text p { font-size: 0.95rem; }
        .text-gradient { background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Compact Bento Box Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 16px; 
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px 15px; 
            border-radius: 16px; 
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            gap: 12px; 
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px); 
            border-color: rgba(163, 2, 255, 0.3);
            box-shadow: 0 15px 30px rgba(4, 6, 51, 0.05);
            background: #ffffff;
        }

        .card i {
            font-size: 2rem; 
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card h3 { 
            font-size: 1.05rem; 
            font-weight: 700; 
            letter-spacing: -0.02em; 
            margin: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.8);
            margin-top: auto; 
        }

    </style>
</head>
<body>

    <div class="gradient-orb"></div>

    <header>
        <a href="index.html" class="logo-link">
            <img src="Logo.png" alt="sedoc logo">
        </a>
    </header>

    <main>
        <div class="hero-text">
            <h1>All <span class="text-gradient">Tools.</span> One Place.</h1>
            <p>Select a tool below to start working with your documents securely.</p>
        </div>

        <div class="grid">
            <a href="pdf-maker.html" class="card">
                <i class="fas fa-images"></i>
                <h3>Image to PDF</h3>
            </a>

            <a href="word-pdf.html" class="card">
                <i class="fas fa-file-word"></i>
                <h3>Word to PDF</h3>
            </a>

            <a href="compressed.html" class="card">
                <i class="fas fa-compress-arrows-alt"></i>
                <h3>Compress PDF</h3>
            </a>
            
            <a href="merge-pdf.html" class="card">
                <i class="fas fa-object-group"></i>
                <h3>Merge PDF</h3>
            </a>

            <a href="split-pdf.html" class="card">
                <i class="fas fa-cut"></i>
                <h3>Split PDF</h3>
            </a>

            <a href="excel-pdf.html" class="card">
                <i class="fas fa-file-pdf"></i>
                <h3>Excel to PDF</h3>
            </a>

            <a href="pdf-excel.html" class="card">
                <i class="fas fa-file-excel"></i>
                <h3>PDF to Excel</h3>
            </a>

            <!-- Naye Visio Tools -->
            <a href="visio-pdf.html" class="card">
                <i class="fas fa-project-diagram"></i>
                <h3>Visio to PDF</h3>
            </a>

            <a href="pdf-visio.html" class="card">
                <i class="fas fa-project-diagram"></i>
                <h3>PDF to Visio</h3>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 sedoc. All Rights Reserved.
    </footer>

</body>
</html>
